version: 1

before:
  hooks:
    - go mod tidy

# Build CLI binary
builds:
  - main: ./cmd/gopdf
    binary: gopdf
    ldflags:
      - -s -w
      - -X github.com/ryomak/gopdf/cmd/gopdf/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: 'Features'
      regexp: '^feat:'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^fix:'
      order: 1
    - title: 'Others'
      order: 999

release:
  github:
    owner: ryomak
    name: gopdf
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}}-v{{.Version}}"
